name: Build & Release Android APK + iOS IPA

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-android:
    name: Build Capacitor Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle caching
        uses: gradle/actions/setup-gradle@v4

      - name: Install Node dependencies
        run: npm ci

      - name: Build production Three.js WebGL2 bundle
        run: npm run build

      - name: Sync Capacitor Android assets & plugins
        run: npx cap sync android

      - name: Prepare Android signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KS_FILE="$RUNNER_TEMP/lixiaoyao-release.jks"
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | tr -d '\r\n\t ' | base64 --decode > "$KS_FILE"
            CLEAN_STORE_PASS=$(printf '%s' "$KEYSTORE_PASS" | tr -d '\r\n')
            CLEAN_KEY_ALIAS=$(printf '%s' "$KEY_ALIAS" | tr -d '\r\n')
            CLEAN_KEY_PASS=$(printf '%s' "$KEY_PASS" | tr -d '\r\n')
            {
              echo "ANDROID_KEYSTORE_PATH=$KS_FILE"
              echo "ANDROID_KEYSTORE_PASSWORD=${CLEAN_STORE_PASS}"
              echo "ANDROID_KEY_ALIAS=${CLEAN_KEY_ALIAS}"
              echo "ANDROID_KEY_PASSWORD=${CLEAN_KEY_PASS}"
            } >> "$GITHUB_ENV"
            keytool -list -keystore "$KS_FILE" -storepass "$CLEAN_STORE_PASS" -alias "$CLEAN_KEY_ALIAS" | grep -i -E "Alias|SHA256"
          else
            echo "::error::Missing ANDROID_KEYSTORE_BASE64 secret! Refusing to generate ephemeral keystore that breaks overwrite installs."
            exit 1
          fi

      - name: Compile Release & Debug APKs via Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease assembleDebug --no-daemon

      - name: Collect & rename APK deliverables
        run: |
          APP_VER=$(node -e "const s=require('fs').readFileSync('src/version.ts','utf8');const m=s.match(/APP_VERSION\s*=\s*'([^']+)'/);console.log(m?m[1]:'1.53');")
          mkdir -p apk-out
          cp android/app/build/outputs/apk/release/app-release.apk "apk-out/lixiaoyao-3d-v${APP_VER}-release.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "apk-out/lixiaoyao-3d-v${APP_VER}-debug.apk"
          ls -lh apk-out

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lixiaoyao-android-apk
          path: apk-out/*.apk
          retention-days: 30

  build-ios:
    name: Build Capacitor iOS Unsigned IPA
    runs-on: macos-15-intel
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Build production Three.js WebGL2 bundle
        run: npm run build

      - name: Sync Capacitor iOS project
        run: npx cap sync ios

      - name: Install CocoaPods dependencies (if Podfile exists)
        run: |
          if [ -f ios/App/Podfile ]; then
            cd ios/App
            pod install --repo-update
          else
            echo "Using Swift Package Manager (CapApp-SPM)"
          fi

      - name: Inspect Xcode & project schemes
        run: |
          xcodebuild -version
          xcodebuild -list -project ios/App/App.xcodeproj

      - name: Build iOS Release .app (Unsigned)
        run: |
          if [ -d ios/App/App.xcworkspace ]; then
            TARGET_FLAG="-workspace ios/App/App.xcworkspace"
          else
            TARGET_FLAG="-project ios/App/App.xcodeproj"
          fi
          xcodebuild $TARGET_FLAG \
            -scheme App \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath ios/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_IDENTITY="" \
            CODE_SIGNING_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package Unsigned .ipa
        run: |
          APP_PATH="ios/DerivedData/Build/Products/Release-iphoneos/App.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: App.app not found at $APP_PATH"
            exit 1
          fi
          APP_VER=$(node -e "const s=require('fs').readFileSync('src/version.ts','utf8');const m=s.match(/APP_VERSION\s*=\s*'([^']+)'/);console.log(m?m[1]:'1.53');")
          IPA_FILE="ipa-out/li-xiaoyao-shushan-3d-v${APP_VER}-unsigned.ipa"
          mkdir -p ipa-out Payload
          cp -R "$APP_PATH" Payload/App.app
          zip -qry "$IPA_FILE" Payload
          rm -rf Payload
          unzip -tq "$IPA_FILE"
          ls -lh "$IPA_FILE"

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lixiaoyao-ios-ipa
          path: ipa-out/*.ipa
          retention-days: 30

  build-ios-fallback:
    name: Build Capacitor iOS Unsigned IPA (macOS arm64 fallback)
    needs: [build-ios]
    if: ${{ needs.build-ios.result != 'success' }}
    runs-on: macos-15
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Build production Three.js WebGL2 bundle
        run: npm run build

      - name: Sync Capacitor iOS project
        run: npx cap sync ios

      - name: Install CocoaPods dependencies (if Podfile exists)
        run: |
          if [ -f ios/App/Podfile ]; then
            cd ios/App
            pod install --repo-update
          else
            echo "Using Swift Package Manager (CapApp-SPM)"
          fi

      - name: Inspect Xcode & project schemes
        run: |
          xcodebuild -version
          xcodebuild -list -project ios/App/App.xcodeproj

      - name: Build iOS Release .app (Unsigned)
        run: |
          if [ -d ios/App/App.xcworkspace ]; then
            TARGET_FLAG="-workspace ios/App/App.xcworkspace"
          else
            TARGET_FLAG="-project ios/App/App.xcodeproj"
          fi
          xcodebuild $TARGET_FLAG \
            -scheme App \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath ios/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_IDENTITY="" \
            CODE_SIGNING_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package Unsigned .ipa
        run: |
          APP_PATH="ios/DerivedData/Build/Products/Release-iphoneos/App.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: App.app not found at $APP_PATH"
            exit 1
          fi
          APP_VER=$(node -e "const s=require('fs').readFileSync('src/version.ts','utf8');const m=s.match(/APP_VERSION\s*=\s*'([^']+)'/);console.log(m?m[1]:'1.53');")
          IPA_FILE="ipa-out/li-xiaoyao-shushan-3d-v${APP_VER}-unsigned.ipa"
          mkdir -p ipa-out Payload
          cp -R "$APP_PATH" Payload/App.app
          zip -qry "$IPA_FILE" Payload
          rm -rf Payload
          unzip -tq "$IPA_FILE"
          ls -lh "$IPA_FILE"

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lixiaoyao-ios-ipa
          path: ipa-out/*.ipa
          retention-days: 30

  publish-release:
    name: Publish GitHub Release
    needs: [build-android, build-ios, build-ios-fallback]
    if: ${{ always() && needs.build-android.result == 'success' && (needs.build-ios.result == 'success' || needs.build-ios-fallback.result == 'success') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (read APP_VERSION)
        uses: actions/checkout@v4

      - name: Download Android APKs
        uses: actions/download-artifact@v4
        with:
          name: lixiaoyao-android-apk
          path: release-assets

      - name: Download iOS IPA
        uses: actions/download-artifact@v4
        with:
          name: lixiaoyao-ios-ipa
          path: release-assets

      - name: Prepare release tag & verify assets
        id: meta
        run: |
          ls -lh release-assets
          APP_VER=$(node -e "const s=require('fs').readFileSync('src/version.ts','utf8');const m=s.match(/APP_VERSION\s*=\s*'([^']+)'/);console.log(m?m[1]:'1.53');")
          echo "ver=${APP_VER}" >> "$GITHUB_OUTPUT"
          test -s "release-assets/lixiaoyao-3d-v${APP_VER}-release.apk"
          test -s "release-assets/lixiaoyao-3d-v${APP_VER}-debug.apk"
          test -s "release-assets/li-xiaoyao-shushan-3d-v${APP_VER}-unsigned.ipa"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
          elif git ls-remote --tags origin "refs/tags/v${APP_VER}" | grep -q "refs/tags/v${APP_VER}"; then
            TAG_NAME="v${APP_VER}-b${GITHUB_RUN_NUMBER}"
          else
            TAG_NAME="v${APP_VER}"
          fi
          echo "tag=${TAG_NAME}" >> "$GITHUB_OUTPUT"

          COMMIT_MSG="$(git log -1 --pretty=%B)"
          {
            echo "### 仙剑 · 锁妖剑台 ${TAG_NAME}（Android APK + iOS IPA 自动发版）"
            echo ""
            echo "#### 本次更新"
            echo "${COMMIT_MSG}"
            echo ""
            echo "#### 安装说明"
            echo "- **Android 手机**：直接下载 \`lixiaoyao-3d-v${APP_VER}-release.apk\` 安装即可（\`-debug.apk\` 为调试包）。"
            echo "- **iPhone (iOS)**：下载 \`li-xiaoyao-shushan-3d-v${APP_VER}-unsigned.ipa\`，在电脑端用 **Sideloadly / AltStore / 爱思助手** 登录 Apple ID 侧载安装（巨魔 TrollStore 可直接安装）。"
          } > release-notes.md

      - name: Publish GitHub Release with Android APK & iOS IPA
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "仙剑·锁妖剑台 ${{ steps.meta.outputs.tag }} (Android + iOS)"
          make_latest: true
          generate_release_notes: true
          body_path: release-notes.md
          files: |
            release-assets/*
