name: Build & Release Android APK + iOS IPA

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Capacitor Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle caching
        uses: gradle/actions/setup-gradle@v4

      - name: Install Node dependencies
        run: npm ci

      - name: Build production Three.js WebGL2 bundle
        run: npm run build

      - name: Sync Capacitor Android assets & plugins
        run: npx cap sync android

      - name: Prepare Android signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KS_FILE="$RUNNER_TEMP/lixiaoyao-release.jks"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$KS_FILE"
            echo "ANDROID_KEYSTORE_PATH=$KS_FILE" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=${KEYSTORE_PASS}" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=${KEY_ALIAS}" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=${KEY_PASS}" >> "$GITHUB_ENV"
          else
            keytool -genkeypair -v \
              -keystore "$KS_FILE" \
              -storepass "lixiaoyao2026" \
              -keypass "lixiaoyao2026" \
              -alias "lixiaoyao" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Shushan Court, OU=Game, O=FWPT, L=Shanghai, ST=SH, C=CN"
            echo "ANDROID_KEYSTORE_PATH=$KS_FILE" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=lixiaoyao2026" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=lixiaoyao" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=lixiaoyao2026" >> "$GITHUB_ENV"
          fi

      - name: Compile Release & Debug APKs via Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease assembleDebug --no-daemon

      - name: Collect & rename APK deliverables
        run: |
          APP_VER=$(node -e "const s=require('fs').readFileSync('src/version.ts','utf8');const m=s.match(/APP_VERSION\s*=\s*'([^']+)'/);console.log(m?m[1]:'1.53');")
          mkdir -p apk-out
          cp android/app/build/outputs/apk/release/app-release.apk "apk-out/lixiaoyao-3d-v${APP_VER}-release.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "apk-out/lixiaoyao-3d-v${APP_VER}-debug.apk"
          ls -lh apk-out

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lixiaoyao-android-apk
          path: apk-out/*.apk
          retention-days: 30

  build-ios:
    name: Build Capacitor iOS Unsigned IPA
    runs-on: macos-15-intel
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Build production Three.js WebGL2 bundle
        run: npm run build

      - name: Sync Capacitor iOS project
        run: npx cap sync ios

      - name: Install CocoaPods dependencies (if Podfile exists)
        run: |
          if [ -f ios/App/Podfile ]; then
            cd ios/App
            pod install --repo-update
          else
            echo "Using Swift Package Manager (CapApp-SPM)"
          fi

      - name: Inspect Xcode & project schemes
        run: |
          xcodebuild -version
          xcodebuild -list -project ios/App/App.xcodeproj

      - name: Build iOS Release .app (Unsigned)
        run: |
          if [ -d ios/App/App.xcworkspace ]; then
            TARGET_FLAG="-workspace ios/App/App.xcworkspace"
          else
            TARGET_FLAG="-project ios/App/App.xcodeproj"
          fi
          xcodebuild $TARGET_FLAG \
            -scheme App \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath ios/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_IDENTITY="" \
            CODE_SIGNING_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package Unsigned .ipa
        run: |
          APP_PATH="ios/DerivedData/Build/Products/Release-iphoneos/App.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: App.app not found at $APP_PATH"
            exit 1
          fi
          APP_VER=$(node -e "const s=require('fs').readFileSync('src/version.ts','utf8');const m=s.match(/APP_VERSION\s*=\s*'([^']+)'/);console.log(m?m[1]:'1.53');")
          IPA_FILE="ipa-out/li-xiaoyao-shushan-3d-v${APP_VER}-unsigned.ipa"
          mkdir -p ipa-out Payload
          cp -R "$APP_PATH" Payload/App.app
          zip -qry "$IPA_FILE" Payload
          rm -rf Payload
          unzip -tq "$IPA_FILE"
          ls -lh "$IPA_FILE"

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lixiaoyao-ios-ipa
          path: ipa-out/*.ipa
          retention-days: 30

  build-ios-fallback:
    name: Build Capacitor iOS Unsigned IPA (macOS arm64 fallback)
    needs: [build-ios]
    if: ${{ needs.build-ios.result != 'success' }}
    runs-on: macos-15
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Build production Three.js WebGL2 bundle
        run: npm run build

      - name: Sync Capacitor iOS project
        run: npx cap sync ios

      - name: Install CocoaPods dependencies (if Podfile exists)
        run: |
          if [ -f ios/App/Podfile ]; then
            cd ios/App
            pod install --repo-update
          else
            echo "Using Swift Package Manager (CapApp-SPM)"
          fi

      - name: Inspect Xcode & project schemes
        run: |
          xcodebuild -version
          xcodebuild -list -project ios/App/App.xcodeproj

      - name: Build iOS Release .app (Unsigned)
        run: |
          if [ -d ios/App/App.xcworkspace ]; then
            TARGET_FLAG="-workspace ios/App/App.xcworkspace"
          else
            TARGET_FLAG="-project ios/App/App.xcodeproj"
          fi
          xcodebuild $TARGET_FLAG \
            -scheme App \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath ios/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_IDENTITY="" \
            CODE_SIGNING_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package Unsigned .ipa
        run: |
          APP_PATH="ios/DerivedData/Build/Products/Release-iphoneos/App.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: App.app not found at $APP_PATH"
            exit 1
          fi
          APP_VER=$(node -e "const s=require('fs').readFileSync('src/version.ts','utf8');const m=s.match(/APP_VERSION\s*=\s*'([^']+)'/);console.log(m?m[1]:'1.53');")
          IPA_FILE="ipa-out/li-xiaoyao-shushan-3d-v${APP_VER}-unsigned.ipa"
          mkdir -p ipa-out Payload
          cp -R "$APP_PATH" Payload/App.app
          zip -qry "$IPA_FILE" Payload
          rm -rf Payload
          unzip -tq "$IPA_FILE"
          ls -lh "$IPA_FILE"

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lixiaoyao-ios-ipa
          path: ipa-out/*.ipa
          retention-days: 30

  publish-release:
    name: Publish GitHub Release
    needs: [build-android, build-ios, build-ios-fallback]
    if: ${{ always() && needs.build-android.result == 'success' && (needs.build-ios.result == 'success' || needs.build-ios-fallback.result == 'success') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (read APP_VERSION)
        uses: actions/checkout@v4

      - name: Download Android APKs
        uses: actions/download-artifact@v4
        with:
          name: lixiaoyao-android-apk
          path: release-assets

      - name: Download iOS IPA
        uses: actions/download-artifact@v4
        with:
          name: lixiaoyao-ios-ipa
          path: release-assets

      - name: Prepare release tag & verify assets
        id: meta
        run: |
          ls -lh release-assets
          APP_VER=$(node -e "const s=require('fs').readFileSync('src/version.ts','utf8');const m=s.match(/APP_VERSION\s*=\s*'([^']+)'/);console.log(m?m[1]:'1.53');")
          echo "ver=${APP_VER}" >> "$GITHUB_OUTPUT"
          test -s "release-assets/lixiaoyao-3d-v${APP_VER}-release.apk"
          test -s "release-assets/lixiaoyao-3d-v${APP_VER}-debug.apk"
          test -s "release-assets/li-xiaoyao-shushan-3d-v${APP_VER}-unsigned.ipa"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          elif git ls-remote --tags origin "refs/tags/v${APP_VER}" | grep -q "refs/tags/v${APP_VER}"; then
            echo "tag=v${APP_VER}-b${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v${APP_VER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release with Android APK & iOS IPA
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "仙剑·锁妖剑台 ${{ steps.meta.outputs.tag }} (Android + iOS)"
          make_latest: true
          body: |
            ### 仙剑 · 锁妖剑台 ${{ steps.meta.outputs.tag }} — 写实 3D 二十关商业战役版（双端自动发版）
            - **藏宝阁装备、剑炉淬炼与侠客皮肤**：灵石经济体系上线，支持购买/强化五大仙剑、四大战甲、四大法宝与五款 3D 实时换装皮肤（即时生效模型材质与战斗属性）
            - **战前剧情对白与重铸交互对打**：入关先现剧情对白（点击「确定 · 拔剑开战」后开打）、四段剑招+剑气飞波、极限闪避瞬影斩、3D 真人剪影残影、男主角仙剑配音与移动端自适应通关结算
            - **四章二十关完整战役与跨端联机**：支持 20 关全关卡跨端双人组队（Co-op）与 1v1 Solo 单挑切磋（`wss://fwpt.cn/lixiaoyao/ws`）

            #### 安装说明
            - **Android 手机**：直接下载 `lixiaoyao-3d-v${{ steps.meta.outputs.ver }}-release.apk` 安装即可。
            - **iPhone (iOS)**：下载 `li-xiaoyao-shushan-3d-v${{ steps.meta.outputs.ver }}-unsigned.ipa`，在电脑端用 **Sideloadly / AltStore / 爱思助手** 登录免费 Apple ID 侧载安装（巨魔 TrollStore 可直接安装）。
          files: |
            release-assets/*
